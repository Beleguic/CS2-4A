version: "3"

services:
  mongo:
    image: mongo:latest
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo-data:/data/db
      - ./SampleCollections:/SampleCollections
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-password}
    working_dir: /SampleCollections
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:latest
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d app"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-poste:
    image: postgres:latest
    volumes:
      - postgres-poste-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB_POSTE:-poste}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d poste"]
      interval: 10s
      timeout: 5s
      retries: 5

  node:
    image: node:20.0.0-alpine
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      # Environnement général
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      
      # Base de données
      MONGO_URL: ${MONGO_URL}
      DATABASE_URL: ${DATABASE_URL}
      
      # Sécurité
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      
      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      
      # Email
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      
      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL}
      
      # Logging
      SECURITY_LOGGING: ${SECURITY_LOGGING:-true}
      DEBUG_LOGGING: ${DEBUG_LOGGING:-true}
      
      # Configuration optionnelle
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-5242880}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-86400000}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend:/home/node/app
    working_dir: /home/node/app
    command: sh -c "npm install && npm run migrate && npm run dev"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  poste:
    image: node:20.0.0-alpine
    depends_on:
      postgres-poste:
        condition: service_healthy
    environment:
      # Environnement général
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT_POSTE:-3001}
      
      # Base de données
      DATABASE_URL_POSTE: ${DATABASE_URL_POSTE}
      
      # Sécurité
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      
      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      
      # Logging
      SECURITY_LOGGING: ${SECURITY_LOGGING:-true}
      DEBUG_LOGGING: ${DEBUG_LOGGING:-true}
      
      # Configuration optionnelle
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-86400000}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./poste:/home/node/poste
    working_dir: /home/node/poste
    command: sh -c "npm install && npm run migrate && npm run dev"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  vue:
    image: node:20.0.0-alpine
    depends_on:
      - node
      - poste
    user: node
    working_dir: /home/node
    environment:
      # Variables Vite.js
      VITE_API_URL: ${VITE_API_URL}
      VITE_POSTE_API_URL: ${VITE_POSTE_API_URL}
      VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
      VITE_STRIPE_SUCCESS_URL: ${VITE_STRIPE_SUCCESS_URL}
      VITE_STRIPE_CANCEL_URL: ${VITE_STRIPE_CANCEL_URL}
      VITE_NODE_ENV: ${VITE_NODE_ENV:-development}
      VITE_DEV_MODE: ${VITE_DEV_MODE:-true}
      VITE_PORT: ${VITE_PORT:-5174}
      VITE_HOST: ${VITE_HOST:-0.0.0.0}
      VITE_DEBUG: ${VITE_DEBUG:-true}
      VITE_VERBOSE_LOGS: ${VITE_VERBOSE_LOGS:-true}
    command: sh -c "npm install && npm run dev -- --port 5174 --host"
    ports:
      - "127.0.0.1:8000:5174"
    volumes:
      - ./tropicool:/home/node

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - postgres-poste

volumes:
  mongo-data: {}
  postgres-data: {}
  postgres-poste-data: {}
