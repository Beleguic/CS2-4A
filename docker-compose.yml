version: "3"

services:
  mongo:
    image: mongo:latest
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo-data:/data/db
      - ./SampleCollections:/SampleCollections
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=password
    working_dir: /SampleCollections
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:latest
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d app"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-poste:
    image: postgres:latest
    volumes:
      - postgres-poste-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: poste
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d poste"]
      interval: 10s
      timeout: 5s
      retries: 5

  node:
    image: node:20.0.0-alpine
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      MONGO_URL: mongodb://root:password@mongo:27017/app?authSource=admin
      DATABASE_URL: postgres://root:password@postgres:5432/app
      JWT_SECRET: secret
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend:/home/node/app
    working_dir: /home/node/app
    command: sh -c "npm install && npm run migrate && npm run dev"

  poste:
    image: node:20.0.0-alpine
    depends_on:
      postgres-poste:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: development
      DATABASE_URL_POSTE: postgres://root:password@postgres-poste:5432/poste
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      SESSION_SECRET: your-super-secret-session-key-change-in-production
      ALLOWED_ORIGINS: http://localhost:8000,http://localhost:3000
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./poste:/home/node/poste
    working_dir: /home/node/poste
    command: sh -c "npm install && npm run migrate && npm run dev"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  vue:
    image: node:20.0.0-alpine
    depends_on:
      - node
      - poste
    user: node
    working_dir: /home/node
    command: sh -c "npm install && npm run dev -- --port 5174 --host"
    ports:
      - "127.0.0.1:8000:5174"
    volumes:
      - ./tropicool:/home/node

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - postgres-poste

volumes:
  mongo-data: {}
  postgres-data: {}
  postgres-poste-data: {}
